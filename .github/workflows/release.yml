# 发新版:push 到 master 即自动定版 —— 跑测试 → 构建前端/后端镜像 → 自动打 tag → 组装部署包挂 Release
#
# 触发:
#   - push 到 master(忽略纯文档/固件/工具改动,这些不影响部署包)
#   - 手动运行(workflow_dispatch),可指定版本号覆盖自动递增
#
# 版本号:取现有最大 v 标签的补丁号 +1(无标签则 v0.1.0)。tag 由最后一步的 Release API
#        连同 Release 一起创建,构建失败或 run 被取消都不会消耗版本号、也不留孤儿 tag。
#        该调用用 GITHUB_TOKEN,GitHub 不会因此再触发一次本工作流(官方的递归保护),
#        所以不会自我循环。连续 push 只发最后一版(见 concurrency)。
#
# 部署包内容:docker-compose.yml、deploy.sh、config.example.json、
#             site/(前端静态产物)、images/streetlight-backend.tar(瘦镜像)
# 使用者:tar xzf 部署包 → ./deploy.sh 生成 config.json → 填写 → 再跑 ./deploy.sh
name: Release 部署包

on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "C3_e53_sc1_pls/**"
      - "tools/**"
      - ".gitignore"
      - ".clangd"
  workflow_dispatch:
    inputs:
      version:
        description: "指定版本号(如 v0.3.0);留空 = 自动补丁号 +1"
        required: false

permissions:
  contents: write

concurrency:
  # 连续 push 只发最后一版:新 run 一起,同组里排队/在跑的旧 run 直接取消。
  # 中间提交没有独立部署包(也没人需要下载中间态),要补就手动跑一次指定版本号。
  group: release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 需要完整历史与标签来计算下一个版本号

      # 质量门禁放最前:测试挂了就别浪费时间构建,更别把坏版本挂上 Release
      - name: 质量门禁(cargo test)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo test --manifest-path backend/Cargo.toml --quiet

      - name: 构建前端 dist
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend_vue/package-lock.json
      - run: npm ci
        working-directory: frontend_vue
      - run: npm run build
        working-directory: frontend_vue

      - name: 构建后端瘦镜像(静态 musl → scratch)
        # 境外 runner 直连 crates.io 更快,故关闭 rsproxy 镜像
        run: docker build -t streetlight-backend:latest --build-arg USE_RS_PROXY=0 backend/

      - name: 计算版本号
        id: ver
        run: |
          set -euo pipefail
          INPUT="${{ inputs.version }}"
          if [ -n "$INPUT" ]; then
            TAG="$INPUT"
            case "$TAG" in v*) ;; *) TAG="v$TAG" ;; esac
          else
            git fetch --tags --force --quiet
            LATEST="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)"
            if [ -z "$LATEST" ]; then
              TAG="v0.1.0"
            else
              IFS=. read -r MAJOR MINOR PATCH <<<"${LATEST#v}"
              TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))"
            fi
          fi
          # 该版本号已被占用就继续 +1,避免与手工标签撞车
          while git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; do
            IFS=. read -r MAJOR MINOR PATCH <<<"${TAG#v}"
            TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          done
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "本次版本:$TAG"

      - name: 组装部署包
        run: |
          set -euxo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          BUNDLE="streetlight-deploy-${VERSION}"
          mkdir -p "$BUNDLE/images" "$BUNDLE/site"
          cp -r frontend_vue/dist/. "$BUNDLE/site/"
          cp deploy/docker-compose.yml deploy/config.example.json deploy/deploy.sh deploy/site-placeholder.html "$BUNDLE/"
          chmod +x "$BUNDLE/deploy.sh"
          docker save streetlight-backend:latest -o "$BUNDLE/images/streetlight-backend.tar"
          tar -czf "${BUNDLE}.tar.gz" "$BUNDLE"
          echo "BUNDLE_TGZ=${BUNDLE}.tar.gz" >> "$GITHUB_ENV"
          ls -lh "${BUNDLE}.tar.gz"

      # tag 不单独推:Release API 会在 tag 不存在时按 target_commitish 建出来,
      # 于是"打 tag + 发 Release"是一次原子调用。若分成两步,run 一旦在两步之间
      # 被 cancel-in-progress 取消,就会留下占着版本号却没有 Release 的孤儿 tag。
      - name: 发布 GitHub Release(附带创建 tag)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }} # 钉在本次构建的提交上,而非届时的分支头
          files: ${{ env.BUNDLE_TGZ }}
          generate_release_notes: true
