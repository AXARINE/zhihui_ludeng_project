[package]
name = "streetlight-backend"
version = "0.1.0"
edition = "2024"
description = "智慧路灯后端:华为云 IoTDA 北向接入 + axum REST API + PostgreSQL(设备/光照/控灯/告警/账号 RBAC)"
repository = "https://github.com/AXARINE/zhihui_ludeng_project"
license = "MIT"
keywords = ["axum", "iot", "iotda", "postgresql", "smart-streetlight"]
categories = ["web-programming::http-server"]

[dependencies]
anyhow = "1"
argon2 = { version = "0.5", features = ["std"] }
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
hex = "0.4"
hmac = "0.13"
# v11 起必须显式选加密后端:rust_crypto 纯 Rust 实现,
# 不依赖 aws-lc 的原生构建工具链(Docker rust 镜像无 cmake)
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", features = ["chrono", "migrate", "postgres", "runtime-tokio"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = { version = "5.5", features = ["axum_extras", "chrono"] }
utoipa-swagger-ui = { version = "9.0", default-features = false, features = ["axum", "debug-embed", "vendored"] }

[lints.clippy]
all = "warn"
cargo = "warn"
nursery = "warn"
pedantic = "warn"
perf = "warn"

[profile.release]
opt-level = 3
strip = true
lto = "fat"
panic = "abort"
codegen-units = 1
