[package]
name = "streetlight-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
argon2 = { version = "0.5", features = ["std"] }
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
hex = "0.4"
hmac = "0.13"
jsonwebtoken = "9"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", features = ["chrono", "migrate", "postgres", "runtime-tokio"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = { version = "5.5", features = ["axum_extras", "chrono"] }
utoipa-swagger-ui = { version = "9.0", default-features = false, features = ["axum", "vendored", "debug-embed"] }

[lints.clippy]
all = "warn"
cargo = "warn"
nursery = "warn"
pedantic = "warn"
