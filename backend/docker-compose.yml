# 智慧路灯后端一键部署:PostgreSQL + Rust 后端
#
# 本地(WSL):cd backend && docker compose up -d --build
# 端口策略:5432/8080 只绑 127.0.0.1(本机访问,局域网不可达);
#           对外演示/公网部署请用 ../deploy/(瘦镜像 + Caddy 单入口,见部署文档 5.4)。
#
# 数据卷复用历史卷 streetlight-pgdata(原 infra-up.sh 创建),已注册设备等数据不丢。
# 后端环境变量来自 .env(env_file),其中 DATABASE_URL 被下方 environment 覆盖为
# compose 内部服务名;本地 cargo run 直连时仍用 .env 里的 127.0.0.1,互不干扰。

name: streetlight

services:
  postgres:
    image: postgres:16
    container_name: streetlight-postgres
    environment:
      POSTGRES_DB: streetlight
      POSTGRES_USER: streetlight
      POSTGRES_PASSWORD: streetlight
    ports:
      - "127.0.0.1:5432:5432" # 只绑本机;云部署/发布部署建议直接删除本映射
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streetlight -d streetlight"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  backend:
    build: .
    container_name: streetlight-backend
    env_file: .env # HUAWEI_AK/SK、HUAWEI_PROJECT_ID、HUAWEI_IOTDA_ENDPOINT/REGION
    environment:
      DATABASE_URL: postgres://streetlight:streetlight@postgres:5432/streetlight
      # 压测/联调:true 时北向调用本地短路(不发真实华为云请求),默认关闭
      IOTHUB_DRY_RUN: "${IOTHUB_DRY_RUN:-false}"
      # 性能参数(见 README 8.6 与 perf/ 压测报告):均有安全默认值
      DATABASE_POOL_SIZE: "${DATABASE_POOL_SIZE:-20}"
      ARGON2_MAX_CONCURRENCY: "${ARGON2_MAX_CONCURRENCY:-32}"
      LOGIN_RATE_LIMIT_PER_MIN: "${LOGIN_RATE_LIMIT_PER_MIN:-30}"
    ports:
      - "127.0.0.1:8080:8080" # 只绑本机;对外入口统一走 deploy/ 的 Caddy
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
volumes:
  pgdata:
    name: streetlight-pgdata
