<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧路灯 WebGIS（真实地图引擎）预览</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root { --primary:#2F6FED; --ok:#0FA46E; --danger:#E5484D; --text:#1F2937; --muted:#6B7280; --card:#fff; --border:#E8ECF1; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"PingFang SC","Microsoft YaHei",sans-serif; color:var(--text); }
  .topbar { height:54px; background:var(--card); border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; padding:0 20px; box-shadow:0 1px 2px rgba(16,24,40,.05); }
  .topbar h1 { font-size:16px; font-weight:600; display:flex; align-items:center; gap:8px; }
  .topbar h1::before { content:""; width:8px; height:18px; border-radius:3px; background:var(--primary); }
  .stats { display:flex; gap:14px; font-size:13px; }
  .stats .s { background:#F7F9FC; border:1px solid var(--border); border-radius:8px; padding:5px 12px; }
  .stats b { font-size:15px; margin-left:4px; }
  #map { height:calc(100vh - 54px); width:100%; }
  .lamp-ico { width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:16px; border:2px solid #fff; box-shadow:0 2px 6px rgba(0,0,0,.3); cursor:pointer; }
  .lamp-ico.on { background:#FFC107; }
  .lamp-ico.off { background:#90A4AE; }
  .lamp-ico.alarm { background:#E5484D; }
  .pop-title { font-size:15px; font-weight:600; margin-bottom:8px; display:flex; align-items:center; gap:6px; }
  .pop-dot { width:8px; height:8px; border-radius:50%; display:inline-block; }
  .pop-dot.ok { background:var(--ok); } .pop-dot.bad { background:var(--danger); }
  .pop-row { display:flex; justify-content:space-between; font-size:13px; padding:3px 0; border-bottom:1px dashed #f0f2f5; }
  .pop-row span:first-child { color:var(--muted); }
  .pop-row b { font-weight:600; }
  .pop-btns { display:flex; gap:6px; margin-top:10px; }
  .btn { flex:1; padding:6px 0; border:none; border-radius:7px; font-size:13px; cursor:pointer; color:#fff; }
  .btn.on { background:var(--ok); } .btn.off { background:#78909C; } .btn.auto { background:var(--primary); }
  .pop-tip { font-size:11px; color:var(--muted); margin-top:8px; line-height:1.5; }
  .leaflet-popup-content-wrapper { border-radius:12px; }
  .legend { position:absolute; right:14px; bottom:24px; z-index:500; background:rgba(255,255,255,.95); border:1px solid var(--border); border-radius:10px; padding:10px 14px; font-size:12px; box-shadow:0 2px 8px rgba(0,0,0,.08); }
  .legend div { display:flex; align-items:center; gap:8px; margin:4px 0; }
  .legend .c { width:16px; height:16px; border-radius:50%; border:1px solid #ddd; }
  .legend .c.on { background:#FFC107; } .legend .c.off { background:#90A4AE; } .legend .c.alarm { background:#E5484D; }
</style>
</head>
<body>
<div class="topbar">
  <h1>智慧路灯 WebGIS · 真实地图引擎（Leaflet + OpenStreetMap）</h1>
  <div class="stats">
    <div class="s">设备 <b id="stTotal">0</b></div>
    <div class="s">在线 <b id="stOnline" style="color:var(--ok)">0</b></div>
    <div class="s">离线 <b id="stOffline" style="color:var(--danger)">0</b></div>
    <div class="s">亮灯 <b id="stLampOn" style="color:#B8860B">0</b></div>
  </div>
</div>
<div id="map"></div>
<div class="legend">
  <div><span class="c on"></span>在线 · 灯亮</div>
  <div><span class="c off"></span>在线 · 灯灭</div>
  <div><span class="c alarm"></span>离线</div>
  <div style="color:#9AA3AF;margin-top:6px">💡 点击点位查看详情 / 控灯</div>
</div>

<script>
// ============================================
// 真实地图引擎：Leaflet + OpenStreetMap 瓦片（免费，无需 Key）
// 替换方案：高德地图 AMap / 百度地图 BMAP（需注册 Key，国内路网更细）
// ============================================

// 演示设备（虚构坐标，围绕真实街道）。接真实系统时：
//   fetch('/api/devices') → 设备表需含 lat/lng 字段
const DEVICES = [
  { id:'light_001', name:'中山路路灯01', loc:'中山路东段', lat:32.0618, lng:118.7915, status:'online',  lamp:'on',  mode:'auto', lux:28,  th:90 },
  { id:'light_002', name:'中山路路灯02', loc:'中山路中段', lat:32.0605, lng:118.7940, status:'online',  lamp:'off', mode:'auto', lux:210, th:90 },
  { id:'light_003', name:'汉口路路灯',   loc:'汉口路',     lat:32.0598, lng:118.7892, status:'online',  lamp:'on',  mode:'manual', lux:15, th:90 },
  { id:'light_004', name:'上海路路灯',   loc:'上海路南段', lat:32.0585, lng:118.7928, status:'offline', lamp:'off', mode:'auto', lux:0,   th:90 },
  { id:'light_005', name:'广州路路灯',   loc:'广州路',     lat:32.0602, lng:118.7968, status:'online',  lamp:'off', mode:'auto', lux:180, th:90 },
  { id:'light_006', name:'北京西路路灯', loc:'北京西路',   lat:32.0632, lng:118.7888, status:'online',  lamp:'on',  mode:'auto', lux:22,  th:90 },
  { id:'light_007', name:'宁海路路灯',   loc:'宁海路',     lat:32.0622, lng:118.7870, status:'online',  lamp:'off', mode:'auto', lux:95,  th:90 },
  { id:'light_008', name:'华侨路路灯',   loc:'华侨路',     lat:32.0638, lng:118.7955, status:'online',  lamp:'on',  mode:'auto', lux:12,  th:90 },
];

const map = L.map('map', { attributionControl:true }).setView([32.061, 118.792], 16);

// ---- 真实底图：高德地图瓦片（国内直连、免 Key、秒开）----
// OSM 瓦片在国内经常加载失败（底图全灰），高德瓦片无需 JS API 与 Key，国内最稳
L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', {
  subdomains: ['1','2','3','4'],
  maxZoom: 18,
  attribution: '&copy; 高德地图'
}).addTo(map);

// 正式项目备选（需注册 Key）：
//   高德 JS API: https://webapi.amap.com/maps?v=2.0&key=你的KEY
//   百度 JS API: https://api.map.baidu.com/api?v=3.0&ak=你的AK
//   OSM 瓦片（仅海外网络可用）: https://tile.openstreetmap.org/{z}/{x}/{y}.png

const markers = new Map();

function iconFor(d){
  const cls = d.status !== 'online' ? 'alarm' : (d.lamp === 'on' ? 'on' : 'off');
  return L.divIcon({ className:'', html:'<div class="lamp-ico '+cls+'">💡</div>',
    iconSize:[30,30], iconAnchor:[15,15], popupAnchor:[0,-16] });
}

function popupHtml(d){
  const st = d.status === 'online'
    ? '<span class="pop-dot ok"></span>在线' : '<span class="pop-dot bad"></span>离线';
  const lamp = d.lamp === 'on' ? '💡 亮' : '🌑 灭';
  return '<div style="min-width:230px">'
    + '<div class="pop-title">'+d.name+'</div>'
    + '<div class="pop-row"><span>设备ID</span><b>'+d.id+'</b></div>'
    + '<div class="pop-row"><span>位置</span><b>'+d.loc+'</b></div>'
    + '<div class="pop-row"><span>设备状态</span><b>'+st+'</b></div>'
    + '<div class="pop-row"><span>光照强度</span><b>'+d.lux+' lux</b></div>'
    + '<div class="pop-row"><span>灯状态</span><b>'+lamp+'</b></div>'
    + '<div class="pop-row"><span>控制模式</span><b>'+(d.mode==='auto'?'自动联动':'手动')+'</b></div>'
    + '<div class="pop-row"><span>联动阈值</span><b>'+d.th+' lux</b></div>'
    + '<div class="pop-btns">'
    +   '<button class="btn on" onclick="sendCmd(\''+d.id+'\',\'on\')">开灯</button>'
    +   '<button class="btn off" onclick="sendCmd(\''+d.id+'\',\'off\')">关灯</button>'
    +   '<button class="btn auto" onclick="sendCmd(\''+d.id+'\',\'auto\')">自动</button>'
    + '</div>'
    + '<div class="pop-tip">接真实系统：按钮改为调 <b>POST /api/devices/{id}/lamp</b>，坐标来自设备表 lat/lng。</div>'
    + '</div>';
}

// 模拟控制（预览）：切换灯态 + 刷新图标
function sendCmd(id, action){
  const d = DEVICES.find(x => x.id === id);
  if (!d) return;
  if (d.status !== 'online') { alert('设备离线，无法控制'); return; }
  d.mode = action === 'auto' ? 'auto' : 'manual';
  if (action === 'on') d.lamp = 'on';
  if (action === 'off') d.lamp = 'off';
  const m = markers.get(id);
  m.setIcon(iconFor(d));
  const pop = m.getPopup();
  if (pop) pop.setContent(popupHtml(d));
  refreshStats();
}

// 模拟光照微变化
setInterval(() => {
  DEVICES.forEach(d => {
    if (d.status !== 'online') return;
    d.lux = Math.max(0, Math.round(d.lux + (Math.random()*8-4)));
  });
}, 5000);

function refreshStats(){
  document.getElementById('stTotal').textContent = DEVICES.length;
  document.getElementById('stOnline').textContent = DEVICES.filter(d=>d.status==='online').length;
  document.getElementById('stOffline').textContent = DEVICES.filter(d=>d.status!=='online').length;
  document.getElementById('stLampOn').textContent = DEVICES.filter(d=>d.lamp==='on').length;
}

DEVICES.forEach(d => {
  const m = L.marker([d.lat, d.lng], { icon: iconFor(d) }).addTo(map).bindPopup(popupHtml(d), { closeButton:true });
  markers.set(d.id, m);
});
refreshStats();
</script>
</body>
</html>
