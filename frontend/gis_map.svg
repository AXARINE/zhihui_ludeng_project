<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <!-- 虚构智慧校园底图 -->
  <rect x="0" y="0" width="1000" height="700" fill="#e8f0e4"/>
  <!-- 湖 -->
  <ellipse cx="760" cy="520" rx="120" ry="70" fill="#bcd9f0" stroke="#9cc4e4" stroke-width="2"/>
  <text x="760" y="525" font-size="16" fill="#5a8fb8" text-anchor="middle">景观湖</text>
  <!-- 草地 -->
  <rect x="60" y="60" width="880" height="80" rx="8" fill="#dcead2"/>
  <text x="100" y="105" font-size="15" fill="#7aa06a">智慧校园 · 演示区域</text>
  <!-- 道路 -->
  <g stroke="#cfd6cc" stroke-width="14" stroke-linecap="round" fill="none">
    <line x1="40" y1="200" x2="960" y2="200"/>
    <line x1="40" y1="380" x2="960" y2="380"/>
    <line x1="40" y1="560" x2="960" y2="560"/>
    <line x1="200" y1="40" x2="200" y2="660"/>
    <line x1="420" y1="40" x2="420" y2="660"/>
    <line x1="640" y1="40" x2="640" y2="660"/>
  </g>
  <g stroke="#d8dfd0" stroke-width="2" stroke-dasharray="6 6" fill="none">
    <line x1="40" y1="200" x2="960" y2="200"/>
    <line x1="40" y1="380" x2="960" y2="380"/>
    <line x1="40" y1="560" x2="960" y2="560"/>
    <line x1="200" y1="40" x2="200" y2="660"/>
    <line x1="420" y1="40" x2="420" y2="660"/>
    <line x1="640" y1="40" x2="640" y2="660"/>
  </g>
  <!-- 楼宇 -->
  <g>
    <rect x="250" y="250" width="120" height="90" rx="6" fill="#cfe0f5" stroke="#9db8dd" stroke-width="2"/>
    <text x="310" y="300" font-size="15" fill="#4a6fa5" text-anchor="middle">教学楼A</text>
    <rect x="460" y="250" width="120" height="90" rx="6" fill="#cfe0f5" stroke="#9db8dd" stroke-width="2"/>
    <text x="520" y="300" font-size="15" fill="#4a6fa5" text-anchor="middle">教学楼B</text>
    <rect x="680" y="250" width="120" height="90" rx="6" fill="#f0dfc6" stroke="#d8bd92" stroke-width="2"/>
    <text x="740" y="300" font-size="15" fill="#a07c46" text-anchor="middle">图书馆</text>
    <rect x="250" y="430" width="120" height="90" rx="6" fill="#f0dfc6" stroke="#d8bd92" stroke-width="2"/>
    <text x="310" y="480" font-size="15" fill="#a07c46" text-anchor="middle">实验楼</text>
    <rect x="460" y="430" width="120" height="90" rx="6" fill="#dcecd9" stroke="#a9cca4" stroke-width="2"/>
    <text x="520" y="480" font-size="15" fill="#5d8a56" text-anchor="middle">食堂</text>
    <rect x="680" y="430" width="120" height="90" rx="6" fill="#dcecd9" stroke="#a9cca4" stroke-width="2"/>
    <text x="740" y="480" font-size="15" fill="#5d8a56" text-anchor="middle">学生宿舍</text>
  </g>
  <!-- 门岗/其他 -->
  <rect x="80" y="120" width="80" height="40" rx="6" fill="#e7d9d4" stroke="#c9b0a6" stroke-width="2"/>
  <text x="120" y="145" font-size="13" fill="#8a6258" text-anchor="middle">东门</text>
  <rect x="840" y="120" width="80" height="40" rx="6" fill="#e7d9d4" stroke="#c9b0a6" stroke-width="2"/>
  <text x="880" y="145" font-size="13" fill="#8a6258" text-anchor="middle">西门</text>
  <!-- 标题角标 -->
  <rect x="20" y="660" width="240" height="30" rx="6" fill="rgba(255,255,255,0.85)"/>
  <text x="32" y="680" font-size="13" fill="#666">图例：</text>
  <circle cx="90" cy="675" r="6" fill="#2F6FED"/><text x="102" y="680" font-size="13" fill="#666">在线</text>
  <circle cx="150" cy="675" r="6" fill="#E5484D"/><text x="162" y="680" font-size="13" fill="#666">离线</text>
</svg>
