<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="启晖智慧路灯">
  <title>启晖智慧路灯</title>
  <!--
    启晖智慧路灯 · 站点图标
    设计：深墨方章（对应侧边栏 #1C1B1A）+ 赤陶路灯 + 暖光晕/光锥，
    取自本项目「深栏暖纸」主题（赤陶 #C96A4A / 暖光 #E8975F）。
    单文件矢量，16px 起可辨识；如需改色只改下方 defs 与 stroke/fill。
  -->
  <defs>
    <!-- 底板：深墨，自上而下微渐变 -->
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E2A26"/>
      <stop offset="1" stop-color="#151412"/>
    </linearGradient>
    <!-- 灯下柔光晕 -->
    <radialGradient id="halo">
      <stop offset="0"   stop-color="#FFDDAE" stop-opacity=".62"/>
      <stop offset=".45" stop-color="#E8975F" stop-opacity=".21"/>
      <stop offset="1"   stop-color="#E8975F" stop-opacity="0"/>
    </radialGradient>
    <!-- 投向地面的光锥 -->
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#FFD9A8" stop-opacity=".45"/>
      <stop offset=".5"  stop-color="#E8975F" stop-opacity=".144"/>
      <stop offset="1"   stop-color="#C96A4A" stop-opacity="0"/>
    </linearGradient>
    <!-- 光晕只向下扩散（灯头以上裁掉） -->
    <clipPath id="under"><rect x="0" y="17.4" width="64" height="47"/></clipPath>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#plate)"/>

  <!-- 字形整体放大 1.1 倍并居中于画布 -->
  <g transform="translate(-4.1,-4.9) scale(1.1)">
    <g clip-path="url(#under)">
      <ellipse cx="23.2" cy="18" rx="21" ry="21" fill="url(#halo)"/>
    </g>
    <path d="M19.9 17.6 H26.5 L43 51 H3.4 Z" fill="url(#beam)"/>
    <!-- 灯柱 + 灯臂 -->
    <path d="M31.5 14.3 C40.5 14.3 46 19 46 26.5 V53.5"
          fill="none" stroke="#E8A587" stroke-width="3.6" stroke-linecap="round"/>
    <!-- 底座 -->
    <rect x="40.4" y="52" width="11.2" height="3.6" rx="1.8" fill="#E8A587"/>
    <!-- 灯头 -->
    <path d="M15.2 12.4 H31.2 L29.4 16.6 H17 Z"
          fill="#E8A587" stroke="#E8A587" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- 发光面 -->
    <ellipse cx="23.2" cy="17.4" rx="5.6" ry="1.5" fill="#FFF3E0"/>
  </g>
</svg>
