services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: streetlight-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: streetlight-postgres
    environment:
      POSTGRES_DB: streetlight
      POSTGRES_USER: streetlight
      POSTGRES_PASSWORD: streetlight
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
